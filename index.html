<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#002478">
<meta name="description" content="Curva S de control de plazo · Ecopreneur">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Curva S">
<title>Curva S · Control de Plazo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: barra de obra arriba (proyecto + pestañas), informe en grilla 2 columnas que colapsa a 1 en teléfono */
:root{
  --bg:#F3F4F9; --surface:#FFFFFF; --surface-2:#E8EAF4; --line:#D7DBEA; --brand:#002478;
  --ink:#002478; --ink-2:#535C82; --ink-3:#7F87AC;
  --plan:#5966AE; --real:#002478; --delay:#B8492F; --ahead:#0A8246; --ep:#D9861C; --warn-bg:#FBEDE8; --ok-bg:#E3F2EA;
  --input:#FFF8E1; --focus:#5966AE;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1230; --surface:#121B40; --surface-2:#19234D; --line:#2A3566; --brand:#0F2C8A;
  --ink:#E6E9F6; --ink-2:#A8B0D6; --ink-3:#7A83AE;
  --plan:#9AA5E6; --real:#E6E9F6; --delay:#EE7A5F; --ahead:#4FC184; --ep:#F0A848; --warn-bg:#3A231D; --ok-bg:#183326;
  --input:#2A2818; --focus:#9AA5E6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1230; --surface:#121B40; --surface-2:#19234D; --line:#2A3566; --brand:#0F2C8A;
  --ink:#E6E9F6; --ink-2:#A8B0D6; --ink-3:#7A83AE;
  --plan:#9AA5E6; --real:#E6E9F6; --delay:#EE7A5F; --ahead:#4FC184; --ep:#F0A848; --warn-bg:#3A231D; --ok-bg:#183326;
  --input:#2A2818; --focus:#9AA5E6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.num,td.n,.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);color:var(--ink);border-bottom:3px solid var(--brand);--bg:var(--ink)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.15rem;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand svg{width:26px;height:20px}
.brand .logo{display:inline-flex;background:#fff;border-radius:6px;padding:2px 6px}.brand>.ttl{padding-left:10px;border-left:2px solid var(--line)}.brand .logo img{height:40px;width:auto;display:block}
.projsel{display:flex;gap:8px;align-items:center;flex:1 1 260px;min-width:0}
.projsel select{flex:1;min-width:0;background:transparent;color:var(--bg);border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);border-radius:6px;padding:6px 8px}
.projsel select option{color:#002478;background:#fff}
.tabs{display:flex;gap:2px;overflow-x:auto;max-width:100%}
.tab{background:none;border:0;color:color-mix(in srgb,var(--bg) 70%,transparent);padding:8px 12px;border-radius:6px;cursor:pointer;font-weight:600;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--brand);color:#fff}
.btn-ghost-top{background:none;border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);color:var(--bg);border-radius:6px;padding:6px 10px;cursor:pointer;white-space:nowrap}

main{padding-block:20px 48px;display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--delay);border-color:color-mix(in srgb,var(--delay) 45%,transparent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.muted{color:var(--ink-2)}
.small{font-size:.85rem}
.note{font-size:.85rem;color:var(--ink-2)}

/* encabezado del informe */
.rephead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end}
.rephead h1{font-size:clamp(1.5rem,3.2vw,2.2rem);font-weight:700;line-height:1.1}
.rephead .meta{color:var(--ink-2);font-size:.95rem}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-weight:700;font-size:.9rem}
.chip.late{background:var(--warn-bg);color:var(--delay)}
.chip.ok{background:var(--ok-bg);color:var(--ahead)}
.chip.ahead{background:var(--ok-bg);color:var(--ahead)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;display:grid;gap:2px;align-content:start}
.kpi .l{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:1.9rem;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.8rem;color:var(--ink-3)}
.kpi.date .v{font-size:1.45rem;white-space:nowrap}
.kpi.bad .v{color:var(--delay)} .kpi.good .v{color:var(--ahead)}

.grid2{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:980px){.grid2{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:18px;min-width:0}

/* gráfico */
.chartcard h2{margin-bottom:4px}
svg.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-body);fill:var(--ink-2);font-size:12px}
.chart .axis{stroke:var(--ink-3);stroke-width:1}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .plan{stroke:var(--plan);stroke-width:3.2;fill:none;stroke-linejoin:round}
.chart .real{stroke:var(--real);stroke-width:3.2;fill:none;stroke-linejoin:round}
.chart .proj{stroke:var(--real);stroke-width:2.4;fill:none;stroke-dasharray:8 6}
.chart .today{stroke:var(--ink-3);stroke-width:1.2;stroke-dasharray:2 4}
.chart .arrow{stroke:var(--delay);stroke-width:2;fill:none}
.chart .arrow.good{stroke:var(--ahead)}
.chart .ahd{fill:var(--delay)} .chart .ahd.good{fill:var(--ahead)}
.chart .lbl{fill:var(--delay);font-size:13px;font-weight:600;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.chart .lbl.good{fill:var(--ahead)}
.chart .spi{fill:var(--ink);font-family:var(--f-display);font-size:30px;font-weight:700}
.chart .spis{fill:var(--ink-2);font-size:12.5px}
.chart .dot{fill:var(--real)} .chart .dotbg{fill:var(--surface)}
.chart .epm{fill:var(--ep);stroke:var(--surface);stroke-width:1.5}
.chart .bp{fill:var(--plan)} .chart .br{fill:var(--real)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.85rem;color:var(--ink-2);margin-top:6px}
.legend i{display:inline-block;width:22px;height:0;border-top:3px solid;vertical-align:middle;margin-right:6px}
.legend i.d{border-top-style:dashed}
.legend i.m{width:10px;height:10px;border:0;background:var(--ep);transform:rotate(45deg);margin-right:8px}

/* tablas */
.tw{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--surface-2);vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap}
td.f{color:var(--ink-3);font-size:.8rem}
.bad{color:var(--delay)} .good{color:var(--ahead)}
tr.hl td{background:var(--warn-bg)}
.bar{height:8px;background:var(--surface-2);border-radius:4px;position:relative;min-width:80px}
.bar span{position:absolute;inset:0 auto 0 0;border-radius:4px}
.bar .p{background:color-mix(in srgb,var(--plan) 45%,transparent)}
.bar .r{background:var(--real);height:4px;top:2px}
.states{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.state{border:1px solid var(--line);border-radius:6px;padding:8px;text-align:center}
.state b{display:block;font-family:var(--f-display);font-size:1.6rem}
.alert{border-radius:6px;padding:10px 12px;font-weight:600}
.alert.bad{background:var(--warn-bg);color:var(--delay)}
.alert.ok{background:var(--ok-bg);color:var(--ahead)}
.alert.neutral{background:var(--surface-2);color:var(--ink-2);font-weight:500}

/* formularios */
label.fld{display:grid;gap:4px;font-size:.85rem;color:var(--ink-2);font-weight:600}
input.in,select.in,textarea.in{background:var(--input);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
input.in.calc{background:var(--surface-2)}
textarea.in{min-height:120px;font-family:var(--f-data);font-size:.85rem}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
td input.in,td select.in{padding:5px 6px}
td input.pct{width:72px;text-align:right}
td input.hh{width:80px;text-align:right}
td input.dt{width:140px}
.req{display:grid;gap:8px;counter-reset:r}
.req li{list-style:none;display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start}
.req li::before{counter-increment:r;content:counter(r);font-family:var(--f-display);font-weight:700;background:var(--ink);color:var(--bg);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-size:.9rem}
.req .ok{color:var(--ahead);font-weight:700}
.req .no{color:var(--delay);font-weight:700}
.cuts{display:flex;flex-wrap:wrap;gap:6px}
.cut{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-family:var(--f-data);font-size:.85rem}
.cut[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:20;font-weight:600;max-width:calc(100% - 32px)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--warn-bg);border-radius:6px;padding:8px 10px}
.empty{text-align:center;padding:40px 16px;display:grid;gap:12px;justify-items:center}
.empty p{max-width:56ch;margin:0}
.issues{margin:0;padding-left:18px;color:var(--delay);font-size:.9rem}
.selectwrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:560px){.kpi .v{font-size:1.5rem}.states{grid-template-columns:repeat(2,1fr)}.hb{display:none}.top .wrap{gap:8px 12px}.top{position:static}th,td{padding:6px 4px}table{font-size:.85rem}.card{padding:12px}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .2s}}
</style>

</head>

<script>
(() => {
'use strict';
const DAY = 864e5;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const toN = s => { if (!s) return NaN; const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d) / DAY; };
const toISO = n => new Date(Math.round(n) * DAY).toISOString().slice(0, 10);
const fD = n => { if (!isFinite(n)) return '—'; const d = new Date(Math.round(n) * DAY); return pad(d.getUTCDate()) + '-' + pad(d.getUTCMonth() + 1) + '-' + d.getUTCFullYear(); };
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const nf = (x, d = 1) => isFinite(x) ? x.toLocaleString('es-CL', {minimumFractionDigits: d, maximumFractionDigits: d}) : '—';
const pct = (x, d = 1) => isFinite(x) ? nf(x * 100, d) + '%' : '—';
const pts = x => isFinite(x) ? (x > 0 ? '+' : x < 0 ? '−' : '') + nf(Math.abs(x * 100), 1) + ' pts' : '—';
const sgn = (x, d = 1, u = '') => isFinite(x) ? (x > 0 ? '+' : x < 0 ? '−' : '') + nf(Math.abs(x), d) + u : '—';
const money = x => isFinite(x) ? '$ ' + Math.round(x).toLocaleString('es-CL') : '—';
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const PERFILES = ['S', 'Lineal', 'Inicio', 'Final'];
const F = (x, p) => p === 'Lineal' ? x : p === 'Inicio' ? 1 - (1 - x) ** 2 : p === 'Final' ? x * x : 3 * x * x - 2 * x * x * x;
const UN = p => (p && p.unidad) || 'HH';
const uid = () => Math.random().toString(36).slice(2, 9);

/* ---------- estado ---------- */
let db = null, coll = null, readOnly = false, local = false;
const LKEY = 'cs.proyectos';
const lread = () => { try { return JSON.parse(localStorage.getItem(LKEY) || 'null'); } catch (e) { return null; } };
const lwrite = o => { localStorage.setItem(LKEY, JSON.stringify(o)); };
const wantRO = /[?&](lectura|ver)\b/.test(location.search);
const onlyProj = new URLSearchParams(location.search).get('proyecto');
const S = { projects: {}, order: [], cur: null, view: 'informe', cutSel: null, draft: null, dirty: false, loading: true, offline: false, confirm: null, editCut: null };
try { const v = localStorage.getItem('cs.view'); if (v) S.view = v; const p = localStorage.getItem('cs.proj'); if (p) S.cur = p; } catch (e) {}
const views = ['informe', 'avance', 'actividades', 'config'];
if (location.hash && views.includes(location.hash.slice(1))) S.view = location.hash.slice(1);

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2600); }
const P = () => S.dirty && S.draft ? S.draft : S.projects[S.cur];
function startEdit() { if (!S.dirty) { S.draft = structuredClone(S.projects[S.cur]); S.dirty = true; } return S.draft; }

/* ---------- parsing de pegado ---------- */
function parseDate(s) {
  s = String(s || '').trim().replace(/^[a-záéíóúñ]{2,4}\.?\s+/i, '');
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);
  if (m) { let y = +m[3]; if (y < 100) y += 2000; return `${y}-${pad(m[2])}-${pad(m[1])}`; }
  return '';
}
function parseNum(s) {
  s = String(s ?? '').replace(/hrs?|h|%|\s/gi, '');
  if (!s) return NaN;
  if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
  else s = s.replace(',', '.');
  return parseFloat(s);
}

/* ---------- modelo (mismo cálculo que el Excel v3) ---------- */
function compute(p, cutIdx) {
  const acts = (p.actividades || []).map(a => ({...a, s: toN(a.ini), e: toN(a.fin) + 1, hh: +a.hh || 0}))
    .filter(a => a.nombre && isFinite(a.s) && isFinite(a.e) && a.e > a.s && a.hh > 0);
  const tot = acts.reduce((t, a) => t + a.hh, 0);
  if (!acts.length || !tot) return null;
  acts.forEach(a => a.w = a.hh / tot);
  const xa = (a, d) => clamp((d - a.s) / (a.e - a.s), 0, 1);
  const planA = (a, d) => F(xa(a, d), a.perfil);
  const plan = d => acts.reduce((t, a) => t + a.w * planA(a, d), 0);
  const start = isFinite(toN(p.inicio)) ? toN(p.inicio) : Math.min(...acts.map(a => a.s));
  const endEx = Math.max(...acts.map(a => a.e));
  const finProg = endEx - 1;
  const per = +p.periodo || 7;
  const cortes = (p.cortes || []).filter(c => isFinite(toN(c.fecha))).sort((a, b) => toN(a.fecha) - toN(b.fecha));
  const realOf = c => acts.reduce((t, a) => t + a.w * clamp((+(c.avance || {})[a.id] || 0) / 100, 0, 1), 0);
  const fases = [...new Set(acts.map(a => a.fase || 'Sin fase'))];
  const base = {acts, tot, plan, planA, start, endEx, finProg, per, cortes, fases};
  if (!cortes.length) return {...base, hasCut: false};
  const ci = cutIdx == null || cutIdx >= cortes.length ? cortes.length - 1 : cutIdx;
  const C = cortes[ci], cut = toN(C.fecha);
  const prog = plan(cut), real = realOf(C);
  // Earned Schedule: fecha en que el plan alcanza el % real (bisección, el plan es no decreciente)
  let ESd;
  if (real <= 0) ESd = start;
  else if (real >= plan(endEx) - 1e-9) ESd = finProg;
  else { let lo = start, hi = endEx; for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; plan(m) < real ? lo = m : hi = m; } ESd = (lo + hi) / 2; }
  const AT = cut - start, ES = ESd - start, PD = finProg - start;
  const SPIt = AT > 0 ? Math.max(0.2, ES / AT) : 1;
  const IEAC = PD / SPIt, finProy = start + Math.round(IEAC);
  const proj = d => plan(start + (d - start) * SPIt);
  const actRows = acts.map(a => {
    const pa = planA(a, cut), ra = clamp((+(C.avance || {})[a.id] || 0) / 100, 0, 1);
    const st = ra >= 1 ? 'Terminada' : ra < pa - 0.005 ? 'Atrasada' : ra > pa + 0.005 ? 'Adelantada' : 'Al día';
    return {...a, pa, ra, imp: a.w * (ra - pa), st};
  });
  const faseRows = fases.map(f => {
    const rs = actRows.filter(a => (a.fase || 'Sin fase') === f); const w = rs.reduce((t, a) => t + a.w, 0);
    return {f, w, hh: rs.reduce((t, a) => t + a.hh, 0), p: rs.reduce((t, a) => t + a.w * a.pa, 0) / w, r: rs.reduce((t, a) => t + a.w * a.ra, 0) / w, n: rs.length};
  });
  // estados de pago: último EP cargado hasta el corte
  let ep = null;
  for (let i = ci; i >= 0; i--) { const v = cortes[i].ep; if (v !== '' && v != null && isFinite(+v)) { const c = cortes[i]; ep = {fecha: toN(c.fecha), ep: +v / 100, real: realOf(c), prog: plan(toN(c.fecha))}; break; } }
  const realPts = cortes.slice(0, ci + 1).map(c => ({d: toN(c.fecha), v: realOf(c), ep: (c.ep !== '' && c.ep != null && isFinite(+c.ep)) ? +c.ep / 100 : null}));
  return {...base, hasCut: true, ci, C, cut, prog, real, ESd, AT, ES, PD, SPIt, IEAC, finProy, proj, actRows, faseRows, ep, realPts, realOf,
    spi: prog > 0 ? real / prog : 1, dev: real - prog, svt: (ES - AT) / 7, tvac: (PD - IEAC) / 7};
}

/* ---------- vistas ---------- */
function render() {
  if (readOnly && S.view !== 'informe') S.view = 'informe';
  document.querySelectorAll('.tab').forEach(t => { t.setAttribute('aria-selected', String(t.dataset.v === S.view)); t.hidden = readOnly && t.dataset.v !== 'informe'; });
  $('#newProjBtn').hidden = readOnly;
  const sel = $('#proj');
  sel.innerHTML = S.order.length ? S.order.map(id => `<option value="${esc(id)}"${id === S.cur ? ' selected' : ''}>${esc(S.projects[id].nombre || 'Sin nombre')}</option>`).join('') : '<option>Sin proyectos</option>';
  sel.disabled = !S.order.length;
  const pl = $('label[for="proj"]'); if (pl) pl.textContent = S.order.length > 1 ? `Proyectos (${S.order.length})` : 'Proyecto';
  const m = $('#main');
  if (S.newProj) { m.innerHTML = viewNew(); bindNew(); return; }
  if (S.loading) { m.innerHTML = `<div class="card empty"><h2>Cargando proyectos…</h2><p class="muted">Leyendo los datos guardados.</p></div>`; return; }
  if (!S.order.length) { m.innerHTML = viewEmpty(); $('#emptyNew')?.addEventListener('click', () => { S.newProj = true; render(); }); return; }
  const p = P();
  if (S.view === 'informe') { m.innerHTML = viewInforme(p); bindInforme(); }
  else if (S.view === 'avance') { m.innerHTML = viewAvance(p); bindAvance(); }
  else if (S.view === 'actividades') { m.innerHTML = viewActs(p); bindActs(); }
  else { m.innerHTML = viewConfig(p); bindConfig(); }
}

function minimos(p) {
  const acts = (p.actividades || []);
  const okActs = acts.filter(a => a.nombre && parseDate(a.ini) && parseDate(a.fin) && +a.hh > 0).length;
  return [
    {t: 'Nombre del proyecto y fecha de inicio de la curva', ok: !!(p.nombre && p.inicio), d: p.inicio ? 'Inicio ' + fD(toN(p.inicio)) : 'Falta la fecha de inicio', v: 'config'},
    {t: 'Actividades con fase, inicio, fin y HH', ok: okActs > 0, d: `${okActs} de ${acts.length} actividades completas`, v: 'actividades'},
    {t: 'Corte semanal: fecha y % completado de cada actividad', ok: (p.cortes || []).length > 0, d: `${(p.cortes || []).length} cortes cargados`, v: 'avance'},
    {t: 'Opcional: % que cobra el contratista en cada estado de pago', ok: (p.cortes || []).some(c => c.ep !== '' && c.ep != null), d: 'Activa el control de estados de pago', v: 'avance', opt: true},
  ];
}
function reqList(p) {
  return `<ol class="req">${minimos(p).map(r => `<li><div><b>${esc(r.t)}</b> <span class="${r.ok ? 'ok' : r.opt ? 'muted' : 'no'}">${r.ok ? '✓' : r.opt ? '·' : 'Falta'}</span><div class="note">${esc(r.d)} · <a href="#${r.v}" data-go="${r.v}">Ir a cargar</a></div></div></li>`).join('')}</ol>`;
}

  const esRows = [

    ['SV(t)', 'ES − AT', sgn(M.svt, 1, ' sem'), M.svt < -0.05 ? `Atraso de ${nf(-M.svt * 7, 0)} días` : M.svt > 0.05 ? `Adelanto de ${nf(M.svt * 7, 0)} días` : 'Al día'],
    ['SPI(t)', 'ES / AT', nf(M.SPIt, 2), M.SPIt < 0.995 ? `Avanzamos al ${nf(M.SPIt * 100, 0)}% del ritmo planificado` : 'En el ritmo planificado o mejor'],
    ['IEAC(t)', 'PD / SPI(t)', nf(M.IEAC / 7) + ' sem', 'Duración total al ritmo actual'],
    ['ETC(t)', 'IEAC(t) − AT', nf((M.IEAC - M.AT) / 7) + ' sem', 'Tiempo que falta para terminar'],
    ['TVAC', 'PD − IEAC(t)', sgn(M.tvac, 1, ' sem'), M.tvac < -0.05 ? `Terminaríamos ${nf(-M.tvac * 7, 0)} días tarde` : M.tvac > 0.05 ? `Terminaríamos ${nf(M.tvac * 7, 0)} días antes` : 'Terminamos en plazo'],
  ];
  const es = `<div class="card"><h3>Plazo · Earned Schedule</h3><div class="tw"><table><thead><tr><th>Indicador</th><th class="n">Valor</th><th>Lectura</th></tr></thead><tbody>
    ${esRows.map(r => `<tr><td><b>${r[0]}</b><div class="f">${r[1]}</div></td><td class="n">${r[2]}</td><td class="small">${esc(r[3])}</td></tr>`).join('')}</tbody></table></div></div>`;

  else {

    epHtml = `${al}<div class="tw"><table><tbody>

    </tbody></table></div></div>`;
  const top = M.actRows.filter(a => a.imp < -0.00005).sort((a, b) => a.imp - b.imp).slice(0, 10);
  const topCard = `<div class="card"><h3>Las 10 actividades que más atrasan</h3>${top.length ? `<div class="tw"><table><thead><tr><th>Actividad</th><th class="n">Prog.</th><th class="n">Real</th><th class="n">Impacto</th></tr></thead><tbody>
    ${top.map(a => `<tr><td>${esc(a.nombre)}<div class="f">${esc(a.fase || '')} · ${a.hh.toLocaleString('es-CL')} ${UN(p)}</div></td><td class="n">${pct(a.pa, 0)}</td><td class="n">${pct(a.ra, 0)}</td><td class="n bad">${pts(a.imp)}</td></tr>`).join('')}
    </tbody></table></div><p class="note">Impacto: puntos del avance total que cada actividad le resta al proyecto.</p>` : '<p class="muted">Ninguna actividad está bajo su programa.</p>'}</div>`;

  const bars = `<div class="card"><h2>Avance semanal planeado vs real</h2>${svgBars(M)}<div class="legend"><span><i style="border-color:var(--plan);border-top-width:8px"></i>Planeado en la semana</span><span><i style="border-color:var(--real);border-top-width:8px"></i>Real entre cortes</span></div>${M.realPts.length && M.realPts[0].d > M.start + M.per ? `<p class="note">El primer corte (${fD(M.realPts[0].d)}) trae ${pct(M.realPts[0].v)} acumulado desde el inicio, por eso no se dibuja como avance de una semana. Las barras reales aparecen desde el segundo corte; si entre dos cortes pasan varias semanas, el avance se reparte entre ellas.</p>` : ''}</div>`;
  const exp = readOnly ? `<p class="note">Vista de solo lectura · ${M.cortes.length} ${M.cortes.length === 1 ? 'corte' : 'cortes'} · ${M.acts.length} actividades · ${M.tot.toLocaleString('es-CL')} ${UN(p)}</p>` : `<div class="row"><button class="btn" id="expCsv" type="button">Descargar tabla semanal (Excel)</button><span class="note">${M.cortes.length} ${M.cortes.length === 1 ? 'corte' : 'cortes'} · ${M.acts.length} actividades · ${M.tot.toLocaleString('es-CL')} ${UN(p)}</span></div>`;
  return `<div class="card" style="display:grid;gap:14px">${head}${cutSel}</div>${kpis}</div>
    <div class="grid2"><div class="stack">${chart}${bars}${fase}</div><div class="stack">${es}${epCard}${topCard}${states}</div></div>${exp}`;

function svgCurve(M) {
  const nar = innerWidth < 640, W = nar ? 520 : 900, H = nar ? 400 : 440, L = 46, R = 14, T = 20, B = 40;
  const x0 = M.start, x1 = Math.max(M.endEx, M.finProy + 4) + 2;
  const X = d => L + (d - x0) / (x1 - x0) * (W - L - R), Y = v => T + (1 - v) * (H - T - B);
  let g = '';
  for (let v = 0; v <= 1.0001; v += 0.2) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${Math.round(v * 100)}%</text>`;
  const d0 = new Date(x0 * DAY); let mm = Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth() + 1, 1) / DAY; const span = x1 - x0; const stepM = span > 400 ? 3 : span > 200 ? 2 : 1;
  for (let i = 0; mm < x1; i++) { const dd = new Date(mm * DAY); if (i % stepM === 0) g += `<line class="grid" x1="${X(mm)}" x2="${X(mm)}" y1="${T}" y2="${H - B}"/><text x="${X(mm)}" y="${H - B + 18}" text-anchor="middle">${MES[dd.getUTCMonth()]} ${String(dd.getUTCFullYear()).slice(2)}</text>`; mm = Date.UTC(dd.getUTCFullYear(), dd.getUTCMonth() + 1, 1) / DAY; }
  g += `<line class="axis" x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}"/><line class="axis" x1="${L}" x2="${L}" y1="${T}" y2="${Y(0)}"/>`;
  const step = Math.max(1, Math.round((x1 - x0) / 300));
  let pp = []; for (let d = x0; d <= x1; d += step) pp.push(`${X(d).toFixed(1)},${Y(M.plan(d)).toFixed(1)}`);
  const rp = [...(M.realPts[0] && M.realPts[0].d > x0 ? [{d: x0, v: 0}] : []), ...M.realPts];
  let pj = []; for (let d = M.cut; d <= x1; d += step) { const v = M.proj(d); pj.push(`${X(d).toFixed(1)},${Y(v).toFixed(1)}`); if (v >= 0.9995) break; }
  const good = M.dev > 0;
  let ann = `<line class="today" x1="${X(M.cut)}" x2="${X(M.cut)}" y1="${T}" y2="${Y(0)}"/><text x="${X(M.cut) + 6}" y="${Y(0) - 8}">Hoy · ${fD(M.cut).slice(0, 5)}</text>`;
  if (Math.abs(M.dev) > 0.004) {
    const yA = Y(M.real), yB = Y(M.prog), cls = good ? ' good' : '';
    ann += `<line class="arrow${cls}" x1="${X(M.cut)}" x2="${X(M.cut)}" y1="${yA + (good ? 6 : -6)}" y2="${yB + (good ? -6 : 6)}" marker-start="url(#ah${good ? 'g' : 'b'})" marker-end="url(#ah${good ? 'g' : 'b'})"/>`;
    ann += `<text class="lbl${cls}" x="${X(M.cut) + 12}" y="${(yA + yB) / 2 - 4}">${good ? 'Adelanto' : 'Atraso'} en avance</text><text class="lbl${cls}" x="${X(M.cut) + 12}" y="${(yA + yB) / 2 + 12}">${nf(Math.abs(M.dev) * 100)} puntos</text>`;
  }
  if (Math.abs(M.svt) > 0.05 && isFinite(M.ESd)) {
    const yR = Y(M.real), xa = X(Math.min(M.ESd, M.cut)), xb = X(Math.max(M.ESd, M.cut)), cls = M.svt > 0 ? ' good' : '';
    if (xb - xa > 14) ann += `<line class="arrow${cls}" x1="${xa + 5}" x2="${xb - 5}" y1="${yR}" y2="${yR}" marker-start="url(#ah${cls ? 'g' : 'b'})" marker-end="url(#ah${cls ? 'g' : 'b'})"/>`;
    const tx = xa - 8 - 130 < L ? (xa + xb) / 2 : xa - 8, ta = tx === xa - 8 ? 'end' : 'middle', ty = ta === 'end' ? yR + 4 : yR + 22;
    ann += `<text class="lbl${cls}" x="${tx}" y="${ty}" text-anchor="${ta}">${M.svt < 0 ? 'Atraso' : 'Adelanto'} en tiempo</text><text class="lbl${cls}" x="${tx}" y="${ty + 16}" text-anchor="${ta}">≈${nf(Math.abs(M.svt))} semanas</text>`;
  }
  const eps = M.realPts.filter(r => r.ep != null).map(r => `<rect class="epm" x="${X(r.d) - 6}" y="${Y(r.ep) - 6}" width="12" height="12" transform="rotate(45 ${X(r.d)} ${Y(r.ep)})"><title>EP ${fD(r.d)}: ${pct(r.ep)}</title></rect>`).join('');
  const dots = M.realPts.map(r => `<circle class="dotbg" cx="${X(r.d)}" cy="${Y(r.v)}" r="5.5"/><circle class="dot" cx="${X(r.d)}" cy="${Y(r.v)}" r="3.5"><title>Real ${fD(r.d)}: ${pct(r.v)}</title></circle>`).join('');
  const spi = `<text class="spi" x="${L + 18}" y="${T + 40}">SPI = ${nf(M.spi, 2)}</text><text class="spis" x="${L + 18}" y="${T + 62}">avance real / avance planeado</text><text class="spis" x="${L + 18}" y="${T + 78}">${M.spi < 0.995 ? 'por debajo de 1, vamos lentos' : M.spi > 1.005 ? 'sobre 1, vamos adelantados' : 'igual a 1, en plazo'}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Curva S planeada ${pct(M.prog)} y real ${pct(M.real)} al ${fD(M.cut)}">
    <defs><marker id="ahb" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahd" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahd good" d="M0,0 L10,5 L0,10 z"/></marker></defs>
    ${g}${spi}<polyline class="plan" points="${pp.join(' ')}"/><polyline class="proj" points="${pj.join(' ')}"/><polyline class="real" points="${rp.map(r => `${X(r.d).toFixed(1)},${Y(r.v).toFixed(1)}`).join(' ')}"/>${ann}${dots}${eps}</svg>`;
}

function weeks(M) {
  const out = []; const lim = Math.max(M.endEx, M.hasCut ? M.finProy : 0) + M.per;
  for (let d = M.start, k = 0; d <= lim; d += M.per, k++) out.push({k, d});
  return out;
}
function svgBars(M) {
  const ws = weeks(M), W = innerWidth < 640 ? 520 : 900, H = 220, L = 46, R = 12, T = 12, B = 34;
  const incP = ws.map((w, i) => i ? M.plan(w.d) - M.plan(ws[i - 1].d) : M.plan(w.d));
  const incR = ws.map(() => null);
  let prevV = 0, prevI = -1;
  M.realPts.forEach((r, k) => { let i = ws.findIndex(w => w.d >= r.d); if (i < 0) i = ws.length - 1; const span = i - prevI; if (k === 0 && i > 0) { prevV = r.v; prevI = i; return; } const inc = (r.v - prevV) / Math.max(1, span); for (let j = Math.max(0, prevI + 1); j <= i; j++) incR[j] = (incR[j] || 0) + inc; prevV = r.v; prevI = i; });
  const mx = Math.max(0.01, ...incP, ...incR.filter(v => v != null)) * 1.1;
  const bw = (W - L - R) / ws.length, X = i => L + i * bw, Y = v => T + (1 - v / mx) * (H - T - B);
  let g = '';
  const tick = mx > 0.2 ? 0.05 : mx > 0.08 ? 0.02 : 0.01;
  for (let v = 0; v <= mx; v += tick) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${Math.round(v * 100)}%</text>`;
  const every = Math.ceil(ws.length / (W < 600 ? 7 : 14));
  ws.forEach((w, i) => {
    g += `<rect class="bp" x="${X(i) + bw * 0.12}" y="${Y(Math.max(0, incP[i]))}" width="${bw * 0.38}" height="${Y(0) - Y(Math.max(0, incP[i]))}"><title>${fD(w.d)} planeado ${pct(incP[i])}</title></rect>`;
    if (incR[i] != null) g += `<rect class="br" x="${X(i) + bw * 0.5}" y="${Y(Math.max(0, incR[i]))}" width="${bw * 0.38}" height="${Y(0) - Y(Math.max(0, incR[i]))}"><title>${fD(w.d)} real ${pct(incR[i])}</title></rect>`;
    if (i % every === 0) g += `<text x="${X(i) + bw / 2}" y="${H - B + 16}" text-anchor="middle">${fD(w.d).slice(0, 5)}</text>`;
  });
  g += `<line class="axis" x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Avance semanal planeado y real">${g}</svg>`;
}

async function saveFile(filename, data, type) {

    setTimeout(() => URL.revokeObjectURL(url), 4000);

}

  const doPaste = rep => {
    const rows = $('#pasteActs').value.split(/\r?\n/).filter(l => l.trim()).map(l => l.split('\t'));
    const parsed = rows.map(r => ({id: uid(), nombre: (r[0] || '').trim(), fase: (r[1] || '').trim(), ini: parseDate(r[2]), fin: parseDate(r[3]), hh: parseNum(r[4]) || 0, perfil: 'S'})).filter(a => a.nombre && !/^actividad$/i.test(a.nombre));
    if (!parsed.length) { toast('No encontré filas. Revisa que estén separadas por columnas.'); return; }
    const d = startEdit(); d.actividades = rep ? parsed : [...(d.actividades || []), ...parsed]; render(); toast(`${parsed.length} actividades cargadas. Revisa y guarda.`);
  };
  $('#pasteAdd').onclick = () => doPaste(false); $('#pasteRep').onclick = () => doPaste(true);
}

/* ----- proyecto ----- */
function viewConfig(p) {
  const f = (id, l, v, t = 'text', ph = '') => `<label class="fld" for="${id}">${l}<input class="in" id="${id}" type="${t}" value="${esc(v)}" placeholder="${ph}"></label>`;
  const confirmDel = S.confirm === 'proj' ? `<div class="confirm"><span>Se borrará el proyecto con todas sus actividades y cortes.</span><button class="btn danger" id="delProjYes" type="button">Eliminar proyecto</button><button class="btn" id="delProjNo" type="button">Cancelar</button></div>` : '';
  return `<div class="grid2"><div class="card" style="display:grid;gap:14px"><h2>Datos del proyecto</h2>
    <div class="formgrid">${f('c-nombre', 'Nombre del proyecto', p.nombre)}${f('c-inicio', 'Inicio de la curva', p.inicio, 'date')}
    ${f('c-cliente', 'Cliente', p.cliente)}${f('c-contratista', 'Contratista', p.contratista)}${f('c-empresa', 'Control a cargo de', p.empresa)}
    ${f('c-periodo', 'Periodo de control (días)', p.periodo ?? 7, 'number')}${f('c-unidad', 'Unidad del peso de actividades', p.unidad || 'HH', 'text', 'HH, $, puntos…')}${f('c-monto', 'Monto contrato del contratista ($) · opcional', p.monto ?? '', 'text', 'Para ver los EP en pesos')}</div>
    ${S.dirty ? `<div class="row"><button class="btn primary" id="saveAll" type="button">Guardar cambios</button><button class="btn" id="discard" type="button">Descartar</button></div>` : ''}
    <div class="row"><button class="btn danger" id="delProj" type="button">Eliminar proyecto</button>${confirmDel}</div></div>
    <div class="card" style="display:grid;gap:12px"><h2>Lo mínimo para un buen informe</h2>${reqList(p)}
    <p class="note">Con eso la app calcula sola: curva planeada con perfil S ponderada por HH, curva real, proyección al ritmo actual, SPI, atraso en puntos y en semanas, Earned Schedule y control de estados de pago.</p></div></div>
    ${local ? `<div class="card" style="display:grid;gap:12px"><h2>Respaldo y vista para compartir</h2>
    <p class="muted" style="margin:0">Los datos se guardan en este dispositivo. Descarga un respaldo después de cada corte: sirve para pasar los datos a otro equipo y para publicar la vista de solo lectura.</p>
    <div class="row"><button class="btn primary" id="bkDown" type="button">Descargar respaldo (datos.json)</button><label class="btn" for="bkFile" style="display:inline-flex;align-items:center">Restaurar desde archivo</label><input id="bkFile" type="file" accept=".json,application/json" hidden><button class="btn" id="bkPub" type="button">Traer datos publicados del sitio</button></div>
    <p class="note" style="margin:0">Para actualizar lo que ven otros: sube ese datos.json al repositorio reemplazando el anterior. Link de solo lectura: <a href="${esc(location.origin + location.pathname)}?lectura">${esc(location.origin + location.pathname)}?lectura</a></p></div>` : ''}`;
}
function bindConfig() {
  bindSaveBar(); bindGo();
  const map = {'c-nombre': 'nombre', 'c-inicio': 'inicio', 'c-cliente': 'cliente', 'c-contratista': 'contratista', 'c-empresa': 'empresa', 'c-periodo': 'periodo', 'c-monto': 'monto', 'c-unidad': 'unidad'};
  Object.entries(map).forEach(([id, k]) => $('#' + id)?.addEventListener('change', e => { let v = e.target.value; if (k === 'periodo') v = Math.max(1, parseInt(v) || 7); if (k === 'monto') v = v.trim() === '' ? '' : parseNum(v); startEdit()[k] = v; render(); }));
  $('#delProj').onclick = () => { S.confirm = 'proj'; render(); };
  $('#bkDown')?.addEventListener('click', backup);
  $('#bkPub')?.addEventListener('click', async () => {
    try { const r = await fetch('datos.json?v=' + Date.now(), {cache: 'no-store'}); if (!r.ok) throw 0; if (!loadInto(await r.json())) throw 0; S.dirty = false; S.draft = null; lwrite(allData().proyectos); render(); toast('Datos publicados cargados en este dispositivo'); }
    catch (x) { toast('No se pudieron leer los datos publicados'); }
  });
  $('#bkFile')?.addEventListener('change', async e => {
    const file = e.target.files[0]; if (!file) return;
    try { const o = JSON.parse(await file.text()); if (!loadInto(o)) throw 0; S.dirty = false; S.draft = null; lwrite(allData().proyectos); render(); toast('Datos restaurados'); }
    catch (x) { toast('El archivo no es un respaldo válido de la app'); }
  });
  $('#delProjNo')?.addEventListener('click', () => { S.confirm = null; render(); });
  $('#delProjYes')?.addEventListener('click', async () => {
    const id = S.cur; S.confirm = null; S.dirty = false; S.draft = null;
    try { if (coll) await coll.doc(id).delete(); } catch (e) { toast('No se pudo eliminar'); return; }
    delete S.projects[id]; S.order = S.order.filter(x => x !== id); if (local) { try { lwrite(allData().proyectos); } catch (e) {} } S.cur = S.order[0] || null; S.view = 'informe'; render(); toast('Proyecto eliminado');
  });
}

/* ---------- guardar ---------- */
let saving = false;
async function save(p, id) {
  if (readOnly) { toast('Tienes acceso de solo lectura'); return false; }
  if (local) { try { p.actualizado = new Date().toISOString(); S.projects[id] = p; if (!S.order.includes(id)) S.order.unshift(id); lwrite(allData().proyectos); toast('Guardado en este dispositivo'); return true; } catch (e) { toast('No se pudo guardar en este dispositivo'); return false; } }
  if (!coll) { toast('Guardado solo en esta sesión (sin conexión al almacenamiento)'); return true; }
  if (saving) return false; saving = true;
  try { p.actualizado = new Date().toISOString(); await coll.doc(id).set(JSON.parse(JSON.stringify(p))); toast('Guardado'); return true; }
  catch (e) { if (e?.code === 'invalid_argument') { readOnly = true; toast('No tienes permiso para guardar cambios'); } else if (e?.code === 'quota_exceeded') toast('El almacenamiento está lleno: elimina proyectos antiguos'); else toast('No se pudo guardar. Intenta de nuevo.'); return false; }
  finally { saving = false; }
}
function showSave() { const b = $('#saveBar'); if (b) b.hidden = false; }
async function commit() {
  if (!S.dirty) { toast('No hay cambios por guardar'); return; } const id = S.cur, p = S.draft;
  S.projects[id] = p; const ok = await save(p, id); if (ok) { S.dirty = false; S.draft = null; } render();
}
function go(v) { if (!views.includes(v)) return; S.view = v; S.confirm = null; try { localStorage.setItem('cs.view', v); } catch (e) {} if (location.hash.slice(1) !== v) history.replaceState(null, '', '#' + v); render(); window.scrollTo(0, 0); }

/* ---------- eventos globales ---------- */
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => go(t.dataset.v)));
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (views.includes(v) && v !== S.view) go(v); });
$('#proj').addEventListener('change', e => { if (S.dirty) { S.dirty = false; S.draft = null; toast('Cambios sin guardar descartados'); } S.cur = e.target.value; S.cutSel = null; S.editCut = null; try { localStorage.setItem('cs.proj', S.cur); } catch (x) {} render(); });
$('#newProjBtn').addEventListener('click', () => { S.newProj = true; render(); });
let lastNar = innerWidth < 640; addEventListener('resize', () => { const n = innerWidth < 640; if (n !== lastNar) { lastNar = n; const ae = document.activeElement; if (S.view === 'informe' && !(ae && ae.matches && ae.matches('input,textarea'))) render(); } });
render();

/* ---------- datos ---------- */
(async () => {
  const timer = setTimeout(() => { if (S.loading) { S.loading = false; S.offline = true; render(); toast('No se pudo leer el almacenamiento todavía'); } }, 10000);
  try { db = window.claude ? await window.claude.use?.('db') : null; } catch (e) { db = null; }
  if (!db) {
    clearTimeout(timer); local = true;
    const pub = async () => { try { const r = await fetch('datos.json?v=' + Date.now(), {cache: 'no-store'}); return r.ok ? await r.json() : null; } catch (e) { return null; } };
    if (wantRO) {
      readOnly = true; let pd = await pub();
      if (pd && onlyProj) { const pr = pd.proyectos || pd; pd = pr[onlyProj] ? {proyectos: {[onlyProj]: pr[onlyProj]}} : null; }
      if (!loadInto(pd)) toast(onlyProj ? 'No se encontró el proyecto' : 'Aún no hay datos publicados');
      if (onlyProj) { const ps = $('.projsel'); if (ps) ps.style.display = 'none'; }
    }
    else {
      // lo guardado en el equipo + lo publicado en el sitio: entra lo nuevo y gana la versión más reciente de cada proyecto
      const mine = lread() || {}, pd = await pub(), pp = (pd && (pd.proyectos || pd)) || {};
      const merged = {...mine}; let nuevos = 0;
      Object.entries(pp).forEach(([id, v]) => { if (!v || !Array.isArray(v.actividades)) return; const m = merged[id]; if (!m || (v.actualizado || '') > (m.actualizado || '')) { merged[id] = v; nuevos++; } });
      if (loadInto(merged)) { if (nuevos) { try { lwrite(allData().proyectos); } catch (e) {} if (Object.keys(mine).length) toast('Se cargaron datos nuevos publicados en el sitio'); } }
    }
    S.loading = false; render();
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
    return;
  }
  try { const u = await window.claude.use('user'); const c = u && await u.can('data.write'); if (c === false) { readOnly = true; render(); } } catch (e) {}
  coll = db.collection('proyectos');
  coll.onSnapshot(snap => {
    if (!snap.metadata.fromCache) clearTimeout(timer);
    snap.docs.forEach(d => { S.projects[d.id] = d.data(); });
    const ids = new Set(snap.docs.map(d => d.id));
    Object.keys(S.projects).forEach(id => { if (!ids.has(id) && !(S.cur === id && S.dirty)) delete S.projects[id]; });
    S.order = Object.keys(S.projects).sort((a, b) => (S.projects[b].actualizado || '').localeCompare(S.projects[a].actualizado || ''));
    if (!S.cur || !S.projects[S.cur]) S.cur = S.order[0] || null;
    S.loading = false; S.offline = false;
    const ae = document.activeElement; const keep = ae && ae.matches && ae.matches('input,textarea,select') && S.dirty;
    if (!keep) render();
  }, err => { clearTimeout(timer); S.loading = false; S.offline = true; render(); });
})();
})();
</script>
